name: Hybrid Extension Check

on:
  push:
    branches:
      - n3rdmade-hybrid
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout Calagopus
        uses: actions/checkout@v4
        with:
          repository: calagopus/panel
          path: panel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Mount extension in Calagopus workspace
        run: |
          rm -rf panel/backend-extensions/gg_n3rdmade_contentmanager
          mkdir -p panel/backend-extensions/gg_n3rdmade_contentmanager
          cp -a extension/backend/. panel/backend-extensions/gg_n3rdmade_contentmanager/

      - name: Cargo check extension
        working-directory: panel
        run: cargo check -p gg_n3rdmade_contentmanager

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify extension package inputs
        run: |
          test -f Metadata.toml
          test -f backend/Cargo.toml
          test -f frontend/package.json
          test -f frontend/src/index.ts
      - name: Build test package
        run: zip -qr n3rdmade-content-manager-hybrid.c7s.zip Metadata.toml frontend backend
      - uses: actions/upload-artifact@v4
        with:
          name: n3rdmade-content-manager-hybrid
          path: n3rdmade-content-manager-hybrid.c7s.zip
